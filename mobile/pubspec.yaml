name: delivery_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.4

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1

  # Maps & location (for live delivery tracking)
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Vendor/menu-item photo picking, uploaded via firebase_storage
  image_picker: ^1.1.2

  # Localization (Arabic-first, RTL) & local persistence (locale/theme choice)
  intl: any
  shared_preferences: ^2.3.2

  # UI motion & animated graphics
  flutter_animate: ^4.5.2
  # Not wired to any screen yet — needs real .json asset files before use.
  lottie: ^3.3.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  # Disk-caches network images (product/vendor photos) with built-in
  # placeholder/error-widget support — Image.network has neither.
  cached_network_image: ^3.4.1
  # Not wired to any screen yet — no OTP/phone-verification flow exists.
  pinput: ^5.0.1
  # Plays uploaded promotion videos (PromoBannerCarousel) — muted, looping
  # inline playback. No other screen needs video, so this is the only user.
  video_player: ^2.9.2

  # Full-color, illustration-style vector icon sets (offline SVG data, no
  # network fetch) for CustomerHomeScreen's category row — Material Icons
  # are single-color line glyphs, too plain for that row's "large product
  # illustration" requirement. `iconify_flutter` provides the `Iconify`
  # widget; the actual icon sets (this app uses `Noto`, Google's colorful
  # emoji-style set) live in the separate `colorful_iconify_flutter`
  # package, imported directly from `package:colorful_iconify_flutter/icons/noto.dart`.
  iconify_flutter: ^0.0.7
  colorful_iconify_flutter: ^0.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # End-to-end suite (integration_test/) that drives the real app on a
  # device/emulator, as opposed to the headless widget tests in test/.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

  # Lightweight mocking for service-layer tests (no code generation).
  mocktail: ^1.0.4
  # Query/DocumentReference are sealed in cloud_firestore 5.x, so they can't
  # be mocktail-mocked directly — use a real in-memory Firestore instead.
  fake_cloud_firestore: ^3.1.0
  # Lets integration_test fake the image_picker platform channel (no OS
  # gallery chooser is drivable by WidgetTester) for the proof-of-delivery
  # photo step — see integration_test/test_helpers.dart.
  image_picker_platform_interface: any
  plugin_platform_interface: any

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  # Fixture image for integration_test/test_helpers.dart's FakeImagePicker —
  # the proof-of-delivery step needs a real on-device file, and this is the
  # only way to get bundled bytes onto the emulator's own filesystem.
  assets:
    - integration_test/fixtures/test_photo.png
    # Demo-only vendor logo — see `_VendorLogo` in
    # store_info_section.dart and seed-demo-vendors.ts for how this is used.
    - assets/images/logo_reference.png

  # Bundled locally so Arabic/Latin text never depends on a runtime fetch to
  # fonts.gstatic.com — Flutter Web's default Material font resolution
  # reaches out to Google's font CDN for "Noto Sans" on first paint, which
  # fails outright in network-restricted environments (observed directly:
  # "Failed to load font Noto Sans ... TypeError: Failed to fetch"). Noto
  # Sans Arabic covers Arabic script, Basic Latin, and Latin/Arabic-Indic
  # numerals in one family, so this single font serves both locales — see
  # assets/fonts/NotoSansArabic-OFL.txt for its SIL Open Font License. It's
  # a single variable font file (weight axis), referenced four times below
  # at different `weight` values — Skia renders the correct instance from
  # each, so four separate static files aren't needed.
  fonts:
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
          weight: 700
